name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install "pytest-homeassistant-custom-component==0.13.375"

      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          if [ "$status" -ne 0 ]; then
            python -c 'from pathlib import Path; lines = Path("pytest-output.txt").read_text().splitlines()[-25:]; message = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print(f"::error title=Pytest failure::{message}")'
          fi
          exit "$status"
